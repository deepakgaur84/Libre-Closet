name: Docker Publish

# Fork of lazztech/libre-closet. Publishes the image to this repository's own
# GitHub Container Registry (ghcr.io/<owner>/<repo>) - no Docker Hub needed.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional extra version tag to apply (e.g. 0.7.0)."
        required: false
        default: ""

env:
  GHCR_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The model package host (staticimgly.com) resets connections from CI
      # runners. Download it here with resume + retries; the Dockerfile seeds
      # npm's cache from it.
      - name: Pre-download background-removal model package
        run: |
          mkdir -p vendor
          curl -fSL --retry 15 --retry-all-errors --retry-delay 5 \
            --connect-timeout 30 -C - \
            -o vendor/imgly-data.tgz \
            "https://staticimgly.com/@imgly/background-removal-data/1.7.0/package.tgz"
          ls -l vendor/imgly-data.tgz

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          # The home NAS is x86-64; add linux/arm64 here if you ever need it.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
